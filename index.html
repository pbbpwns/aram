<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111315" />
    <title>ARAM: Mayhem Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <div id="site-skeleton" class="site-skeleton" aria-live="polite" hidden>
        <span class="visually-hidden">Loading champion data</span>
        <div class="skeleton-hero"><span class="skeleton-line skeleton-eyebrow"></span><span class="skeleton-line skeleton-title"></span><span class="skeleton-line skeleton-copy"></span></div>
        <div class="skeleton-controls"><span></span><span></span><span></span><span></span></div>
        <div class="skeleton-columns"><div></div><div></div><div></div></div>
      </div>
      <header class="hero">
        <div class="eyebrow">ARAM: MAYHEM / LIVE OP.GG DATA</div>
        <div class="hero-line">
          <div>
            <div class="champion-title"><img id="champion-portrait" class="champion-portrait" src="https://opgg-static.akamaized.net/meta/images/lol/latest/champion/Gangplank.png?image=q_auto:good,f_png,w_96,h_96&v=1618" alt="" /><h1 id="champion-name">Gangplank</h1></div>
            <p>One screen for the data that matters once the shop opens.</p>
          </div>
          <div class="header-meta">
            <a id="source-link" class="source-link" href="https://op.gg/lol/modes/aram-mayhem/gangplank/augments" target="_blank" rel="noreferrer">OP.GG source <span aria-hidden="true">↗</span></a>
            <div class="data-status" aria-live="polite"><span id="status-badge" class="status-badge">Live</span><span id="updated-at">Updated recently</span></div>
          </div>
        </div>
      </header>

      <section class="command-bar" aria-label="Champion and augment controls">
        <button id="champion-picker-toggle" class="champion-picker-toggle" type="button" aria-expanded="false" aria-controls="champion-picker">
          <span class="control-label">Champion</span>
          <span id="selected-champion-label">Gangplank</span>
          <span class="picker-chevron" aria-hidden="true">⌄</span>
        </button>
        <label class="champion-search"><span>Find champion</span><input id="champion-search" type="search" placeholder="Search champions" /></label>
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Filter this list (augments)" /><kbd id="search-shortcut">⌘F</kbd></label>
        <div class="sort-control" aria-label="Augment sort order">
          <button class="sort is-active" data-sort="pick">Pick rate</button>
          <button class="sort" data-sort="win">Win rate</button>
        </div>
        <label class="theme-toggle" title="Use light mode">
          <input id="theme-toggle" type="checkbox" />
          <span class="theme-track" aria-hidden="true"><span class="theme-thumb"></span></span>
          <span>Light</span>
        </label>
      </section>
      <section id="champion-picker" class="champion-picker" aria-label="Choose a champion" hidden>
        <div id="champion-grid" class="champion-grid"></div>
      </section>
      <div id="recent-champions" class="recent-champions" aria-label="Recently viewed champions"></div>
      <div class="view-controls">
        <label class="check-control"><input id="top-toggle" type="checkbox" /><span>Top recommendations only</span></label>
        <label class="check-control"><input id="density-toggle" type="checkbox" /><span>Compact spacing</span></label>
      </div>

      <section id="content" class="content" aria-live="polite"></section>
    </main>
    <template id="empty-state"><div class="empty-state">No matching recommendations in this snapshot.</div></template>
    <script src="data/catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
